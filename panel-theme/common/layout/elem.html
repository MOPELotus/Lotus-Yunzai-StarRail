<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="shortcut icon" href="#"/>
  <link rel="stylesheet" type="text/css" href="{{_styles_path}}common/common.css"/>
  {{if _theme_path}}
  <link rel="stylesheet" type="text/css" href="{{_theme_path}}common/common.css"/>
  {{/if}}
  <style>body {transform:none} body .container {background-color:#242e45} body:not(.original-theme) .head-box {background-color:#303f60}</style>
  <title>{{cardBrand}}</title>
  {{block 'css'}}
  {{/block}}
</head>
{{set elemCls = {火:'pyro',冰:'cryo',风:'anemo',雷:'electro',量子:'quantum',虚数:'geo',物理:'sr', }[element||elem] || element || elem || 'hydro' }}
<body class="elem-{{elemCls}} {{displayMode || mode || `default`}}-mode {{bodyClass}}" {{sys.scale}}>
<div class="container elem-bg" id="container">
  {{block 'main'}}{{/block}}
  <div class="copyright">{{cardBrand}}</div>
</div>
</body>
</html>
